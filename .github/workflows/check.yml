name: check

on:
  push:
    # feat/**: sem PR, o fast-forward na main só entra depois dos dois jobs verdes na branch.
    branches: [main, 'feat/**']
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm check

  # Em paralelo ao `check`. Constrói a web, sobe o `wrangler dev` (sem login, telemetria desligada) e roda o Playwright em Chromium.
  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @coringa/web exec playwright install --with-deps chromium
      - run: pnpm e2e
      # Só em falha: o relatório HTML e as capturas de tela (o trace fica desligado: ele guardaria o token do assento).
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: playwright-report
          path: |
            packages/web/playwright-report
            packages/web/test-results
          retention-days: 7
