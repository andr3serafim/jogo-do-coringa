<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Fim de partida: direções</title>
<!--
  Protótipo das três direções do fim de partida (decisoes.md 2026-11-24 (6)): só para as fotos, fora do jogo. A arte é desenho original
  do projeto em SVG, no traço de xilogravura do Coringa da mesa (`ui/cards/Coringa.tsx`): tinta, papel, vermelho e ouro, sem copiar
  gravura de ninguém. Parâmetros: ?dir=a|b|c&res=vitoria|derrota&fundo=<url da foto da mesa>.
-->
<style>
  :root {
    --tinta: #17120f; --papel: #f1f0ea; --vermelho: #b8261c; --ouro: #f5c238; --rosa: #ee9db5; --verde: #6fa86c;
    --madeira: #8a5a2b; --madeira-escura: #1d120b;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; font-family: 'Archivo', system-ui, sans-serif; color: var(--tinta); }
  body { background: #222 center / cover no-repeat; }
  .veu { position: fixed; inset: 0; background: rgb(23 18 15 / 0.62); display: grid; place-items: center; padding: 16px; }
  .madeira { font-family: 'Alfa Slab One', serif; text-transform: uppercase; letter-spacing: 0.01em; }
  .num { font-variant-numeric: tabular-nums; font-weight: 700; }
  .rotulo { font-size: 11px; font-weight: 800; letter-spacing: 0.12em; text-transform: uppercase; }
  button { font: inherit; cursor: pointer; }
  .btn { min-height: 44px; padding: 8px 14px; border: 3px solid var(--tinta); background: var(--papel); font-weight: 800; box-shadow: 3px 3px 0 var(--madeira); }
  .btn.primario { background: var(--ouro); font-family: 'Alfa Slab One', serif; text-transform: uppercase; font-weight: 400; font-size: 18px; }
  .linha { display: flex; flex-wrap: wrap; gap: 10px; }
  .linha .btn { flex: 1 1 auto; }

  /* A · Capa de folheto: o painel é a capa de um cordel, com a gravura no alto e o título como no frontispício. */
  .a { width: min(94vw, 460px); background: var(--papel); border: 4px solid var(--tinta); outline: 2px solid var(--tinta); outline-offset: -12px; padding: 22px 22px 20px; display: grid; gap: 12px; box-shadow: 8px 8px 0 var(--tinta); }
  .a .gravura { border: 3px solid var(--tinta); background: var(--papel); aspect-ratio: 16 / 10; }
  .a .titulo { text-align: center; font-size: clamp(30px, 9vw, 44px); line-height: 0.95; }
  .a .sub { text-align: center; font-weight: 700; }
  .a .dados { display: flex; justify-content: center; gap: 18px; border-block: 2px solid var(--tinta); padding: 6px 0; }

  /* B · Faixa de feira: uma faixa de tinta atravessa a mesa, com o carimbo da palavra e a gravura num medalhão. */
  .b { width: 100vw; background: var(--tinta); color: var(--papel); border-block: 5px solid var(--ouro); padding: 22px 24px; display: grid; grid-template-columns: auto 1fr; gap: 22px; align-items: center; }
  .b .medalhao { width: 190px; aspect-ratio: 1; border-radius: 50%; border: 5px solid var(--ouro); background: var(--papel); overflow: hidden; box-shadow: 0 0 0 4px var(--tinta), 0 0 0 7px var(--ouro); }
  .b .carimbo { display: inline-block; font-size: clamp(40px, 8vw, 68px); line-height: 1; padding: 6px 16px 10px; border: 5px solid currentColor; transform: rotate(-4deg); }
  .b.vitoria .carimbo { color: var(--ouro); }
  .b.derrota .carimbo { color: #ff7a66; }
  /* B ajustada: só o Coringa no medalhão, maior; a palavra em verde ou vermelho; o fundo do medalhão claro; a borda dourada nos dois. */
  .b2.vitoria .carimbo { color: #6fd07f; }
  .b2.derrota .carimbo { color: #ff6b5a; }
  .b2.vitoria .medalhao { background: #e3f4e1; }
  .b2.derrota .medalhao { background: #fbe1dc; }
  .b .dados { display: flex; gap: 18px; margin: 14px 0 12px; flex-wrap: wrap; }
  .b .btn { background: var(--papel); }
  .b .btn.primario { background: var(--ouro); }

  /* C · Palco: a cortina de pano vermelho abre (vitória) ou se fecha pela metade (derrota) sobre a gravura iluminada. */
  .c { width: min(94vw, 520px); background: var(--madeira-escura); color: var(--papel); border: 4px solid var(--tinta); box-shadow: 0 0 0 4px var(--madeira), 10px 10px 0 4px var(--tinta); }
  .c .palco { position: relative; aspect-ratio: 16 / 9; overflow: hidden; background: radial-gradient(circle at 50% 38%, #f8e7b0 0 22%, #3a2414 60%); }
  .c .palco svg.arte { position: absolute; inset: 6% 18% 0; width: 64%; height: 94%; }
  .c .cortina { position: absolute; top: 0; bottom: 0; width: 26%; background: repeating-linear-gradient(90deg, #8e1b14 0 14px, #b8261c 14px 26px); border-bottom: 6px solid var(--ouro); }
  .c .cortina.esq { left: 0; } .c .cortina.dir { right: 0; }
  .c.derrota .cortina { width: 38%; }
  .c .bambinela { position: absolute; inset: 0 0 auto; height: 14%; background: repeating-linear-gradient(90deg, #8e1b14 0 20px, #b8261c 20px 40px); border-bottom: 5px solid var(--ouro); }
  .c .corpo { padding: 16px 20px 20px; display: grid; gap: 12px; }
  .c .titulo { font-size: clamp(30px, 8vw, 46px); text-align: center; line-height: 1; color: var(--ouro); }
  .c.derrota .titulo { color: #ff7a66; }
  .c .sub { text-align: center; font-weight: 700; }
  .c .dados { display: flex; justify-content: center; gap: 18px; }

  @media (max-width: 640px) {
    .veu { align-items: end; padding: 0; }
    .a { width: 100vw; box-shadow: none; border-inline: 0; border-bottom: 0; }
    .b { grid-template-columns: 1fr; text-align: center; padding: 18px 16px 22px; }
    .b .medalhao { width: 140px; margin: 0 auto; }
    .b .dados { justify-content: center; }
    .c { width: 100vw; box-shadow: none; }
  }
</style>
</head>
<body>
<div class="veu"><div id="painel"></div></div>
<script>
  const q = new URLSearchParams(location.search);
  const dir = q.get('dir') ?? 'a';
  const res = q.get('res') ?? 'vitoria';
  if (q.get('fundo')) document.body.style.backgroundImage = `url("${q.get('fundo')}")`;

  // --- A arte: o Coringa da mesa (mesmo chapéu, guizos e gola), em gravura. ---
  const HAT = 'M14 31C10 23 6 17 4 10c8 2 14 6 18 12 2-8 6-14 10-18 4 4 8 10 10 18 4-6 10-10 18-12-2 7-6 13-10 21z';
  const STRIPES = 'M10 16c4 2 7 5 9 9M32 10v14M54 16c-4 2-7 5-9 9';
  const COLLAR = 'M16 54l6-6 5 6 5-6 5 6 5-6 6 6-2 9H18z';
  /** O Coringa: `rosto` 'alegre' (sorriso), 'triste' (boca para baixo) ou 'riso' (boca aberta); `chapeu` false: sem chapéu (caiu). */
  function coringa({ x, y, s, capa, rosto = 'alegre', chapeu = true, inclina = 0 }) {
    const boca = rosto === 'triste' ? 'M26 47c3.5-4 9.5-4 13 0' : rosto === 'riso' ? 'M25 42.5h14c-1 6-12 6-14 0z' : 'M25.5 43c3.5 5.5 9.5 5.5 13 0';
    const olhos = rosto === 'triste' ? 'M26 36.5l3 1.5M35 38l3-1.5' : 'M26 37.5l3-2M35 35.5l3 2';
    return `<g transform="translate(${x} ${y}) rotate(${inclina} 32 40) scale(${s})">
      <circle cx="32" cy="40" r="17" fill="${capa}" />
      ${chapeu ? `<path d="${HAT}" fill="#17120f"/><path d="${STRIPES}" stroke="#f1f0ea" stroke-width="1.6" fill="none"/>
      <circle cx="4" cy="10" r="3.4" fill="#f5c238" stroke="#17120f" stroke-width="2"/><circle cx="32" cy="4" r="3.4" fill="#f5c238" stroke="#17120f" stroke-width="2"/><circle cx="60" cy="10" r="3.4" fill="#f5c238" stroke="#17120f" stroke-width="2"/>` : ''}
      <circle cx="32" cy="40" r="12" fill="#f1f0ea" stroke="#17120f" stroke-width="2.6"/>
      <path d="${olhos}" stroke="#17120f" stroke-width="2.2" stroke-linecap="round" fill="none"/>
      <path d="${boca}" stroke="#17120f" stroke-width="2.2" stroke-linecap="round" fill="${rosto === 'riso' ? '#b8261c' : 'none'}"/>
      <circle cx="24.5" cy="41" r="1.8" fill="#b8261c"/><circle cx="39.5" cy="41" r="1.8" fill="#b8261c"/>
      <path d="${COLLAR}" fill="#17120f"/>
    </g>`;
  }
  /** O sol de raios da xilogravura (vitória). */
  function sol(cx, cy, r, n = 18) {
    let raios = '';
    for (let i = 0; i < n; i++) {
      const a = (i / n) * Math.PI * 2, b = a + Math.PI / n;
      raios += `M${cx} ${cy}L${cx + Math.cos(a) * r} ${cy + Math.sin(a) * r}L${cx + Math.cos(b) * r} ${cy + Math.sin(b) * r}Z`;
    }
    return `<path d="${raios}" fill="#f5c238" stroke="#17120f" stroke-width="1.5"/><circle cx="${cx}" cy="${cy}" r="${r * 0.36}" fill="#f5c238" stroke="#17120f" stroke-width="2"/>`;
  }
  /** Hachura de chuva em diagonal (derrota). */
  function chuva(w, h) {
    let d = '';
    for (let i = -h; i < w; i += 14) d += `M${i} 0l${h * 0.35} ${h}`;
    return `<path d="${d}" stroke="#17120f" stroke-width="1.4" opacity=".55"/>`;
  }
  /** Bandeirolas de festa (vitória). */
  function bandeirolas(w) {
    let d = `<path d="M0 8Q${w / 2} 34 ${w} 8" stroke="#17120f" stroke-width="2" fill="none"/>`;
    const cores = ['#b8261c', '#f5c238', '#6fa86c', '#ee9db5'];
    for (let i = 0; i < 9; i++) {
      const x = (i + 0.5) * (w / 9), y = 8 + 26 * (1 - Math.pow((x - w / 2) / (w / 2), 2)) * 0.96;
      d += `<path d="M${x - 9} ${y}L${x + 9} ${y}L${x} ${y + 18}Z" fill="${cores[i % 4]}" stroke="#17120f" stroke-width="1.6"/>`;
    }
    return d;
  }
  function chao(w, h) {
    let d = `<rect x="0" y="${h - 24}" width="${w}" height="24" fill="#17120f"/>`;
    for (let x = 6; x < w; x += 12) d += `<path d="M${x} ${h - 24}l6 -6" stroke="#17120f" stroke-width="2"/>`;
    return d;
  }
  /** A gravura: vitória (o seu Coringa sob o sol e as bandeirolas, o do Bot caído) ou derrota (o do Bot rindo, o seu sem chapéu, na chuva). */
  function gravura(res, w = 320, h = 200) {
    if (res === 'vitoria') {
      return `<svg class="arte" viewBox="0 0 ${w} ${h}" width="100%" height="100%" role="img" aria-label="Você venceu: o seu Coringa sob o sol">
        <rect width="${w}" height="${h}" fill="#f1f0ea"/>${sol(w / 2, 70, 66)}${bandeirolas(w)}${chao(w, h)}
        ${coringa({ x: w / 2 - 52, y: 62, s: 1.65, capa: '#ee9db5', rosto: 'riso' })}
        ${coringa({ x: w - 104, y: 104, s: 0.95, capa: "#6fa86c", rosto: "triste", chapeu: false, inclina: 28 })}
        <path d="M${w - 70} ${h - 26}l-8 -16 18 -6z" fill="#17120f"/>
      </svg>`;
    }
    return `<svg class="arte" viewBox="0 0 ${w} ${h}" width="100%" height="100%" role="img" aria-label="O Bot venceu: o Coringa dele rindo">
      <rect width="${w}" height="${h}" fill="#d9d4c7"/>${chuva(w, h)}${chao(w, h)}
      ${coringa({ x: w / 2 - 52, y: 50, s: 1.65, capa: '#6fa86c', rosto: 'riso' })}
      ${coringa({ x: 24, y: 104, s: 0.95, capa: "#ee9db5", rosto: "triste", chapeu: false, inclina: -24 })}
      <g transform="translate(70 ${h - 44}) rotate(-20)"><path d="${HAT}" fill="#17120f" transform="scale(.55)"/></g>
    </svg>`;
  }

  const titulo = res === 'vitoria' ? 'Você venceu' : 'Bot venceu';
  const motivo = res === 'vitoria' ? 'Você zerou a vida do Bot.' : 'O Bot zerou a sua vida.';
  const dados = `<span><span class="rotulo">Duração</span> <span class="num">12:48</span></span><span><span class="rotulo">Placar</span> <span class="num">${res === 'vitoria' ? 'Você 1 × 0 Bot' : 'Você 0 × 1 Bot'}</span></span>`;
  const botoes = `<button class="btn primario">Revanche</button>
    <div class="linha"><button class="btn">Ver a mesa</button><button class="btn">Rever a partida</button><button class="btn">Voltar ao início</button></div>`;

  const p = document.getElementById('painel');
  if (dir === 'a') {
    p.innerHTML = `<section class="a ${res}"><p class="rotulo" style="text-align:center;margin:0">Fim da partida</p>
      <div class="gravura">${gravura(res)}</div><h2 class="madeira titulo" style="margin:0">${titulo}!</h2><p class="sub" style="margin:0">${motivo}</p>
      <div class="dados">${dados}</div>${botoes}</section>`;
  } else if (dir === 'b2') {
    // O retrato: só o seu Coringa (feliz ou triste), ocupando o círculo com uma folga pequena.
    const rosto = res === 'vitoria' ? 'riso' : 'triste';
    const retrato = `<svg viewBox="0 0 64 64" width="100%" height="100%" role="img" aria-label="${res === 'vitoria' ? 'O seu Coringa feliz' : 'O seu Coringa triste'}">${coringa({ x: 4, y: 6, s: 0.88, capa: '#ee9db5', rosto })}</svg>`;
    p.innerHTML = `<section class="b b2 ${res}"><div class="medalhao">${retrato}</div><div><p class="rotulo" style="margin:0 0 6px">Fim da partida</p>
      <h2 class="madeira carimbo" style="margin:0">${res === 'vitoria' ? 'Vitória!' : 'Derrota'}</h2><p style="margin:10px 0 0;font-weight:700">${titulo}. ${motivo}</p>
      <div class="dados">${dados}</div><div style="display:grid;gap:10px;max-width:560px">${botoes}</div></div></section>`;
    document.querySelector('.veu').style.padding = '0';
  } else if (dir === 'b') {
    p.innerHTML = `<section class="b ${res}"><div class="medalhao">${gravura(res, 200, 200)}</div><div><p class="rotulo" style="margin:0 0 6px">Fim da partida</p>
      <h2 class="madeira carimbo" style="margin:0">${res === 'vitoria' ? 'Vitória!' : 'Derrota'}</h2><p style="margin:10px 0 0;font-weight:700">${titulo}. ${motivo}</p>
      <div class="dados">${dados}</div><div style="display:grid;gap:10px;max-width:560px">${botoes}</div></div></section>`;
    document.querySelector('.veu').style.padding = '0';
  } else {
    p.innerHTML = `<section class="c ${res}"><div class="palco">${gravura(res)}<div class="cortina esq"></div><div class="cortina dir"></div><div class="bambinela"></div></div>
      <div class="corpo"><p class="rotulo" style="text-align:center;margin:0">Fim da partida</p><h2 class="madeira titulo" style="margin:0">${titulo}!</h2>
      <p class="sub" style="margin:0">${motivo}</p><div class="dados">${dados}</div>${botoes}</div></section>`;
  }
</script>
</body>
</html>
